# Production Docker Compose for PraxisFlow
# Multi-service production deployment with health checks, logging, and monitoring

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════
  # DATABASES
  # ═══════════════════════════════════════════════════════════════
  postgres-primary:
    image: pgvector/pgvector:pg16
    container_name: praxisflow-postgres-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-praxisflow}
      POSTGRES_USER: ${POSTGRES_USER:-praxisflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praxisflow} -d ${POSTGRES_DB:-praxisflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - praxisflow-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-replica:
    image: pgvector/pgvector:pg16
    container_name: praxisflow-postgres-replica
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-praxisflow}
      POSTGRES_USER: ${POSTGRES_USER:-praxisflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MASTER_HOST: postgres-primary
      POSTGRES_REPLICATION_MODE: replica
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praxisflow} -d ${POSTGRES_DB:-praxisflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # VECTOR DATABASE
  # ═══════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: praxisflow-qdrant
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__CLUSTER__ENABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # GRAPH DATABASE
  # ═══════════════════════════════════════════════════════════════
  neo4j:
    image: neo4j:5.24-enterprise
    container_name: praxisflow-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 3G
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # MESSAGE QUEUE
  # ═══════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: praxisflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - praxisflow-internal

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: praxisflow-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: production
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
      AUTH_TYPE: DISABLED
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # CACHE & SESSION STORE
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: praxisflow-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # OBJECT STORAGE
  # ═══════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: praxisflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-praxisflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - praxisflow-internal

  minio-init:
    image: minio/mc:latest
    container_name: praxisflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 ${MINIO_ROOT_USER:-praxisflow} ${MINIO_ROOT_PASSWORD}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb minio/meeting-audio --ignore-existing;
      /usr/bin/mc mb minio/meeting-transcripts --ignore-existing;
      /usr/bin/mc mb minio/backups --ignore-existing;
      /usr/bin/mc anonymous set public minio/meeting-transcripts;
      exit 0;
      "
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # LLM GATEWAY
  # ═══════════════════════════════════════════════════════════════
  llm-gateway:
    build:
      context: ./llm-gateway
      dockerfile: Dockerfile
    container_name: praxisflow-llm-gateway
    environment:
      LITELLM_CONFIG: /app/litellm_config.yaml
      LITELLM_ROUTING_POLICIES: /app/routing_policies.yaml
      PORT: 4000
      HOST: 0.0.0.0
      # Provider API keys (loaded from secrets)
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-praxisflow}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-praxisflow}
      # Redis
      REDIS_URL: redis://redis:6379/1
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
      # Prometheus
      PROMETHEUS_PORT: 9090
    ports:
      - "4000:4000"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    depends_on:
      - postgres-primary
      - redis
      - qdrant
    networks:
      - praxisflow-internal
      - praxisflow-monitoring

  # ═══════════════════════════════════════════════════════════════
  # BACKEND API
  # ═══════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisflow-backend
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://${POSTGRES_USER:-praxisflow}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-praxisflow}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-praxisflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: meeting-audio
      MINIO_BUCKET_TRANSCRIPTS: meeting-transcripts
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: https://app.praxisflow.com,https://api.praxisflow.com
      # LLM Gateway
      LLM_GATEWAY_URL: http://llm-gateway:4000
      LLM_GATEWAY_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    depends_on:
      postgres-primary:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    networks:
      - praxisflow-internal
      - praxisflow-monitoring

  # ═══════════════════════════════════════════════════════════════
  # CELERY WORKERS
  # ═══════════════════════════════════════════════════════════════
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisflow-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 --prefetch-multiplier=1 -Q asr,extraction,integrations,celery
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://${POSTGRES_USER:-praxisflow}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-praxisflow}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-praxisflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      LLM_GATEWAY_URL: http://llm-gateway:4000
      LLM_GATEWAY_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    depends_on:
      - backend
      - redis
      - kafka
    networks:
      - praxisflow-internal
      - praxisflow-monitoring

  worker-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisflow-worker-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://${POSTGRES_USER:-praxisflow}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-praxisflow}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - redis
      - kafka
    networks:
      - praxisflow-internal

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: praxisflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: https://api.praxisflow.com
      NEXT_PUBLIC_WS_URL: wss://api.praxisflow.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    depends_on:
      - backend
    networks:
      - praxisflow-internal
      - praxisflow-external

  # ═══════════════════════════════════════════════════════════════
  # OBSERVABILITY STACK
  # ═══════════════════════════════════════════════════════════════
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: praxisflow-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
      - "13133:13133" # Health check
    networks:
      - praxisflow-monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  langfuse:
    image: langfuse/langfuse:2
    container_name: praxisflow-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-praxisflow}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-praxisflow}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://langfuse:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres-primary
      - redis
    networks:
      - praxisflow-monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: praxisflow-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - praxisflow-monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  grafana:
    image: grafana/grafana:11.0.0
    container_name: praxisflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.praxisflow.com
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - praxisflow-monitoring
    depends_on:
      - prometheus
      - otel-collector
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # ═══════════════════════════════════════════════════════════════
  # REVERSE PROXY / LOAD BALANCER
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: praxisflow-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - llm-gateway
    networks:
      - praxisflow-internal
      - praxisflow-external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ═══════════════════════════════════════════════════════════════
  # BACKUP SERVICE
  # ═══════════════════════════════════════════════════════════════
  backup:
    image: postgres:16-alpine
    container_name: praxisflow-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
      BACKUP_RETENTION_DAYS: 30
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-praxisflow}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: backups
      S3_REGION: us-east-1
    volumes:
      - ./infrastructure/scripts/backup.sh:/backup.sh:ro
    entrypoint: /bin/sh -c "chmod +x /backup.sh && /backup.sh"
    depends_on:
      - postgres-primary
      - minio
    networks:
      - praxisflow-internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

# ═══════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════
volumes:
  postgres_primary_data:
    driver: local
  postgres_replica_data:
    driver: local
  qdrant_data:
    driver: local
  qdrant_snapshots:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ═══════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════
networks:
  praxisflow-internal:
    driver: bridge
    internal: true
  praxisflow-external:
    driver: bridge
  praxisflow-monitoring:
    driver: bridge
    internal: true