upstream praxisflow_frontend {
  server frontend:3000;
}

upstream praxisflow_backend {
  server backend:8000;
}

server {
  listen 80;
  server_name app.praxisflow.com api.praxisflow.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.praxisflow.com api.praxisflow.com;

  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 500m;

  location = /health {
    proxy_pass http://praxisflow_backend/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    proxy_pass http://praxisflow_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws {
    proxy_pass http://praxisflow_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://praxisflow_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
