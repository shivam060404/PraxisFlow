name: CI

# PraxisFlow CI — reflects the repo as it actually exists:
#   backend:  FastAPI + Celery + LangGraph (pytest, unit suite, no live DB required)
#   frontend: Next.js 15 dashboard (typecheck + lint + production build)
#
# Deployment pipelines are intentionally NOT here yet: infrastructure/k8s
# manifests and environment targets do not exist. Add a deploy job only when
# those artifacts are real.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ami:ami_dev_password@localhost:5432/ci
        run: prisma generate

      - name: Validate Prisma schema and migrations
        run: prisma validate

      # Prisma client generation requires the schema to validate; DATABASE_URL
      # is only needed for `db push`/migrations, which unit tests do not run.

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret-not-used-in-prod-0123456789
        run: python -m pytest tests/ -q --ignore=tests/test_rls.py

      # tests/test_rls.py self-skips without TEST_RLS_DATABASE_URL; the
      # explicit ignore keeps that contract obvious in CI logs.

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/**/test-results/**
          if-no-files-found: ignore

  backend-lint:
    name: Backend — ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pipx install ruff

      - name: Ruff check
        run: ruff check app/ tests/

  frontend-build:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pipx install pip-audit
          pip-audit -r backend/requirements.txt

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-services:
    name: Backend — Postgres + Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate client and apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: |
          prisma generate
          prisma migrate deploy
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE ci_shadow' || true
          prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url ******localhost:5432/ci_shadow \
            --exit-code
      - name: Run service-backed tests
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret-not-used-in-prod-0123456789
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/ -q --ignore=tests/test_rls.py

  frontend-e2e:
    name: Frontend — browser E2E
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Run browser E2E
        env:
          NEXT_PUBLIC_DEV_AUTH: "false"
        run: |
          npm run start -- --hostname 127.0.0.1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000 && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          npm run e2e
