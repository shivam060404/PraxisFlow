name: CI

# PraxisFlow CI — reflects the repo as it actually exists:
#   backend:  FastAPI + Celery + LangGraph (pytest, unit suite, no live DB required)
#   frontend: Next.js 15 dashboard (typecheck + lint + production build)
#
# Deployment pipelines are intentionally NOT here yet: infrastructure/k8s
# manifests and environment targets do not exist. Add a deploy job only when
# those artifacts are real.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: prisma generate

      # Prisma client generation requires the schema to validate; DATABASE_URL
      # is only needed for `db push`/migrations, which unit tests do not run.

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret-not-used-in-prod-0123456789
        run: pytest tests/ -q --ignore=tests/test_rls.py

      # tests/test_rls.py self-skips without TEST_RLS_DATABASE_URL; the
      # explicit ignore keeps that contract obvious in CI logs.

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/**/test-results/**
          if-no-files-found: ignore

  backend-lint:
    name: Backend — ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pipx install ruff

      - name: Ruff check
        run: ruff check app/ tests/ --exit-zero
        # --exit-zero until the codebase is fully clean; violations still show
        # inline in the log so they can be burned down incrementally.

  frontend-build:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        continue-on-error: true   # report-only until baseline triage
        run: |
          pipx install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-0000-0000 || true

      - name: npm audit (frontend)
        continue-on-error: true   # report-only until baseline triage
        run: npm audit --audit-level=high || true
